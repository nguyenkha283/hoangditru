# Deploy code lên Hostinger.
#
# Gói hosting không có SSH, nên không dùng được symlink hay wp-cli. Thay vào đó
# đẩy file trực tiếp qua FTPS vào đúng wp-content/themes và wp-content/plugins —
# WordPress thấy theme và plugin ở vị trí chuẩn, không cần loader hay thủ thuật gì.
#
#   job lint   php -l mọi file. Lỗi cú pháp thì dừng, không deploy.
#   job ftp    dò wp-content trên server rồi đẩy wp-content/ qua FTPS.
#
# Secret cần đặt ở GitHub repo → Settings → Secrets and variables → Actions:
#   FTP_HOST      IP máy chủ FTP, đúng như hPanel → Files → FTP Accounts hiện.
#                 Hostinger chỉ công bố IP; chứng chỉ FTPS của máy này là
#                 *.hstgr.io nên không tên nào ta có xác thực được. Kết nối vẫn
#                 mã hoá, chỉ không chứng thực được danh tính máy chủ. Chi tiết
#                 trong scripts/ftp-resolve.sh.
#   FTP_USER      username FTP
#   FTP_PASSWORD  password FTP
#   FTP_PATH      (tuỳ chọn) đường dẫn wp-content. Bỏ trống thì workflow tự dò.
#
# ⚠️ TUYỆT ĐỐI KHÔNG dùng hPanel → Git cho site này. hPanel Git XOÁ SẠCH thư mục
# đích trước mỗi lần kéo code. Ngày 2026-10-23 nó được trỏ vào public_html và đã
# xoá toàn bộ file PHP gốc của WordPress, thay wp-content bằng nội dung repo.
# Chỉ deploy bằng FTPS qua job ftp.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ đọc. Không job nào đẩy nhánh, nên workflow không cần quyền ghi repo.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Kiểm tra cú pháp PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc deploy/manifest.txt
        run: |
          set -euo pipefail
          sed -e 's/\r$//' deploy/manifest.txt | grep -vE '^[[:space:]]*(#|$)' > paths.txt || true
          if [ ! -s paths.txt ]; then
            echo "::error::deploy/manifest.txt không có dòng nào."
            exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              themes/*|plugins/*) ;;
              *) echo "::error::Dòng '$p' phải bắt đầu bằng themes/ hoặc plugins/"; exit 1 ;;
            esac
            case "$p" in
              *..*) echo "::error::Dòng '$p' không hợp lệ"; exit 1 ;;
            esac
            if [ ! -d "wp-content/$p" ]; then
              echo "::error::Không tìm thấy wp-content/$p"
              exit 1
            fi
          done < paths.txt
          echo "Sẽ deploy:"; cat paths.txt

      - name: php -l
        run: |
          set -euo pipefail
          find wp-content -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null
          echo "Đã kiểm $(find wp-content -name '*.php' | wc -l) file PHP."

      # php -l KHÔNG bắt được file rỗng: file 0 byte không có lỗi cú pháp.
      # Ngày 2026-10-23 một lệnh sửa file viết sai đã cắt functions.php và
      # style.css về 0 byte, lint vẫn xanh, và suýt deploy lên server.
      - name: Không file nào được rỗng hoặc mất header
        run: |
          set -euo pipefail

          empty=$(find wp-content -type f -size 0 ! -name '.gitkeep' || true)
          if [ -n "$empty" ]; then
            echo "::error::Có file rỗng trong wp-content:"
            printf '%s\n' "$empty" | sed 's/^/  /'
            exit 1
          fi

          # Theme hỏng header là WordPress không nhận ra theme nữa.
          grep -q '^ Theme Name:' wp-content/themes/hoangditru/style.css \
            || { echo "::error::style.css mất header 'Theme Name:'"; exit 1; }
          grep -q "define( 'HDT_VERSION'" wp-content/themes/hoangditru/functions.php \
            || { echo "::error::functions.php mất define HDT_VERSION"; exit 1; }

          # Mỗi plugin phải còn file chính cùng tên thư mục.
          for d in wp-content/plugins/*/; do
            n=$(basename "$d")
            [ -f "$d$n.php" ] || ls "$d"*.php >/dev/null 2>&1 \
              || { echo "::error::Plugin $n không có file PHP nào"; exit 1; }
          done

          echo "OK — $(find wp-content -type f | wc -l) file, không có file rỗng."

      # Script dò wp-content quyết định file được đẩy đi đâu, nên nó phải có
      # test và test phải chạy trước mỗi lần deploy.
      - name: Test scripts/ftp-resolve.sh
        run: bash scripts/ftp-resolve.test.sh

  ftp:
    name: Đẩy lên Hostinger qua FTPS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Chưa đặt FTP_HOST / FTP_USER / FTP_PASSWORD — bỏ qua bước deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Dò wp-content thay vì tin vào FTP_PATH. Lý do: FTP-Deploy-Action tự TẠO
      # thư mục nếu server-dir không tồn tại, nên một FTP_PATH sai sẽ chạy xanh
      # mà code nằm ở chỗ không ai dùng. Script chỉ chấp nhận thư mục có đủ
      # themes/, plugins/ và wp-includes/ bên cạnh; nhiều hơn một kết quả thì
      # dừng để khỏi deploy nhầm site. Logic có test ở scripts/ftp-resolve.sh.
      - name: Dò wp-content trên server
        id: resolve
        if: steps.check.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set +e
          path=$(bash scripts/ftp-resolve.sh)
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "server-dir sẽ dùng: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Lần 1. continue-on-error để còn cơ hội thử lại: Hostinger chặn tạm thời
      # khi có nhiều phiên FTP trong thời gian ngắn, và lỗi đó tự hết sau vài phút.
      - name: FTPS deploy
        id: ftp1
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ steps.resolve.outputs.path }}
          # Chỉ đẩy code. uploads/ và mọi thứ khác trên server không nằm trong
          # local-dir nên không bị đụng tới.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map

      - name: Nghỉ 90 giây trước khi thử lại
        if: steps.check.outputs.ok == 'true' && steps.ftp1.outcome == 'failure'
        run: |
          echo "::warning::Lần đẩy thứ nhất thất bại. Nghỉ 90 giây rồi thử lại — máy chủ FTP của Hostinger hay chặn tạm thời khi có nhiều phiên liên tiếp."
          sleep 90

      - name: FTPS deploy (lần 2)
        id: ftp2
        if: steps.check.outputs.ok == 'true' && steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ steps.resolve.outputs.path }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map

      # continue-on-error ở lần 1 làm job vẫn xanh kể cả khi cả hai lần đều hỏng,
      # nên phải tự đánh đỏ. Không có bước này thì "job success" sẽ nói dối.
      - name: Kết luận
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ "${{ steps.ftp1.outcome }}" = "success" ]; then
            echo "Đẩy thành công ngay lần đầu."
          elif [ "${{ steps.ftp2.outcome }}" = "success" ]; then
            echo "Đẩy thành công ở lần thử thứ hai."
          else
            echo "::error::Cả hai lần đẩy FTPS đều thất bại."
            exit 1
          fi
