# Deploy code lên Hostinger.
#
# Gói hosting không có SSH, nên không dùng được symlink hay wp-cli. Thay vào đó
# đẩy file trực tiếp qua FTPS vào đúng wp-content/themes và wp-content/plugins —
# WordPress thấy theme và plugin ở vị trí chuẩn, không cần loader hay thủ thuật gì.
#
#   job lint          php -l mọi file. Lỗi cú pháp thì dừng, không deploy.
#   job ftp           đẩy wp-content/ qua FTPS (cần 3 secret, xem bên dưới).
#   job deploy-branch dựng nhánh "deploy" cho hPanel → Git, nếu gói có Git.
#
# Secret cần đặt ở GitHub repo → Settings → Secrets and variables → Actions:
#   FTP_HOST      máy chủ FTP của Hostinger (hPanel → Files → FTP Accounts)
#   FTP_USER      username FTP
#   FTP_PASSWORD  password FTP
#   FTP_PATH      đường dẫn wp-content trên server. Mặc định
#                 /public_html/wp-content/ (domain chính). Site này chạy trên
#                 DOMAIN PHỤ nên BẮT BUỘC phải đặt, dạng
#                 /domains/<domain>/public_html/wp-content/
#
# Thiếu 3 secret đầu thì job ftp chỉ in cảnh báo rồi bỏ qua, workflow vẫn xanh.
# FTP_PATH sai thì job ftp ĐỎ ở bước kiểm tra, không đẩy file nào.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Kiểm tra cú pháp PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc deploy/manifest.txt
        run: |
          set -euo pipefail
          sed -e 's/\r$//' deploy/manifest.txt | grep -vE '^[[:space:]]*(#|$)' > paths.txt || true
          if [ ! -s paths.txt ]; then
            echo "::error::deploy/manifest.txt không có dòng nào."
            exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              themes/*|plugins/*) ;;
              *) echo "::error::Dòng '$p' phải bắt đầu bằng themes/ hoặc plugins/"; exit 1 ;;
            esac
            case "$p" in
              *..*) echo "::error::Dòng '$p' không hợp lệ"; exit 1 ;;
            esac
            if [ ! -d "wp-content/$p" ]; then
              echo "::error::Không tìm thấy wp-content/$p"
              exit 1
            fi
          done < paths.txt
          echo "Sẽ deploy:"; cat paths.txt

      - name: php -l
        run: |
          set -euo pipefail
          find wp-content -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null
          echo "Đã kiểm $(find wp-content -name '*.php' | wc -l) file PHP."

  ftp:
    name: Đẩy lên Hostinger qua FTPS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Chưa đặt FTP_HOST / FTP_USER / FTP_PASSWORD — bỏ qua bước deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Chốt an toàn: FTP_PATH sai thì FTP-Deploy-Action sẽ lặng lẽ TẠO thư mục
      # mới và đẩy code vào chỗ không ai dùng. Liệt kê thư mục đích trước, bắt
      # buộc phải thấy themes/ và plugins/ — tức đó đúng là wp-content của một
      # bản WordPress đã cài.
      - name: Kiểm tra FTP_PATH trên server
        if: steps.check.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/public_html/wp-content/' }}
        run: |
          set -uo pipefail

          path="$FTP_PATH"
          case "$path" in /*) ;; *) path="/$path" ;; esac
          case "$path" in */) ;; *) path="$path/" ;; esac
          echo "Đường dẫn kiểm tra: $path"

          if ! listing=$(curl -sS --ssl-reqd --max-time 60 \
                           --user "$FTP_USER:$FTP_PASSWORD" \
                           "ftp://${FTP_HOST}${path}"); then
            echo "::error::Không liệt kê được ${path} trên ${FTP_HOST}. Kiểm tra FTP_HOST, FTP_USER, FTP_PASSWORD và FTP_PATH."
            exit 1
          fi

          names=$(printf '%s\n' "$listing" | awk 'NF {print $NF}')
          echo "Thư mục đích đang có:"
          printf '%s\n' "$names" | sed 's/^/  /' | head -30

          for d in themes plugins; do
            if ! printf '%s\n' "$names" | grep -qx "$d"; then
              echo "::error::Không thấy '${d}' trong ${path}. FTP_PATH sai, hoặc WordPress chưa được cài ở domain đó. Dừng lại để không tạo thư mục rác trên server."
              exit 1
            fi
          done

          echo "OK — ${path} đúng là wp-content của một bản WordPress."

      - name: FTPS deploy
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ secrets.FTP_PATH || '/public_html/wp-content/' }}
          # Chỉ đẩy code. uploads/ và mọi thứ khác trên server không nằm trong
          # local-dir nên không bị đụng tới.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map

  deploy-branch:
    name: Dựng nhánh deploy (cho hPanel Git, nếu gói có)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cập nhật nhánh deploy
        run: |
          set -euo pipefail
          sed -e 's/\r$//' deploy/manifest.txt | grep -vE '^[[:space:]]*(#|$)' > /tmp/paths.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC_SHA=$(git rev-parse --short HEAD)

          OUT=$(mktemp -d)
          if git ls-remote --exit-code --heads origin deploy > /dev/null 2>&1; then
            git fetch origin deploy
            git worktree add "$OUT" -B deploy origin/deploy
          else
            git worktree add --detach "$OUT"
            git -C "$OUT" checkout --orphan deploy
          fi

          find "$OUT" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p "$OUT/themes" "$OUT/plugins"

          while IFS= read -r p; do
            cp -R "wp-content/$p" "$OUT/$p"
          done < /tmp/paths.txt

          find "$OUT" -name '.DS_Store' -delete
          find "$OUT" -type d -name node_modules -prune -exec rm -rf {} +

          cd "$OUT"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua."
          else
            git commit -q -m "Deploy từ main @ $SRC_SHA"
            git push origin deploy
          fi
