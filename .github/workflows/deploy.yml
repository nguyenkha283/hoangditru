# Deploy code lên Hostinger.
#
# Gói hosting không có SSH, nên không dùng được symlink hay wp-cli. Thay vào đó
# đẩy file trực tiếp qua FTPS vào đúng wp-content/themes và wp-content/plugins —
# WordPress thấy theme và plugin ở vị trí chuẩn, không cần loader hay thủ thuật gì.
#
#   job lint   php -l mọi file. Lỗi cú pháp thì dừng, không deploy.
#   job ftp    đẩy wp-content/ qua FTPS (cần 3 secret, xem bên dưới).
#
# ⚠️ TUYỆT ĐỐI KHÔNG dùng hPanel → Git cho site này. hPanel Git XOÁ SẠCH thư mục
# đích trước mỗi lần kéo code. Trỏ nó vào wp-content là mất theme mặc định,
# mất plugin, mất uploads. Nhánh "deploy" trước đây dành cho cách đó đã bị xoá,
# và job dựng nhánh đó cũng đã bỏ. Chỉ deploy bằng FTPS qua job ftp.
#
# Secret cần đặt ở GitHub repo → Settings → Secrets and variables → Actions:
#   FTP_HOST      máy chủ FTP của Hostinger (hPanel → Files → FTP Accounts)
#   FTP_USER      username FTP
#   FTP_PASSWORD  password FTP
#   FTP_PATH      (tuỳ chọn) đường dẫn wp-content trên server. Mặc định
#                 /public_html/wp-content/ — đúng cho domain chính của gói,
#                 là trường hợp của site này. Chỉ cần đặt khi tài khoản FTP có
#                 thư mục gốc khác (vd gốc đã là public_html → /wp-content/).
#
# Thiếu 3 secret đầu thì job ftp chỉ in cảnh báo rồi bỏ qua, workflow vẫn xanh.
# FTP_PATH sai thì job ftp ĐỎ ở bước kiểm tra, không đẩy file nào.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ đọc. Không job nào còn đẩy nhánh, nên workflow không cần quyền ghi repo —
# và không thể dựng lại nhánh deploy dù có sửa nhầm.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Kiểm tra cú pháp PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc deploy/manifest.txt
        run: |
          set -euo pipefail
          sed -e 's/\r$//' deploy/manifest.txt | grep -vE '^[[:space:]]*(#|$)' > paths.txt || true
          if [ ! -s paths.txt ]; then
            echo "::error::deploy/manifest.txt không có dòng nào."
            exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              themes/*|plugins/*) ;;
              *) echo "::error::Dòng '$p' phải bắt đầu bằng themes/ hoặc plugins/"; exit 1 ;;
            esac
            case "$p" in
              *..*) echo "::error::Dòng '$p' không hợp lệ"; exit 1 ;;
            esac
            if [ ! -d "wp-content/$p" ]; then
              echo "::error::Không tìm thấy wp-content/$p"
              exit 1
            fi
          done < paths.txt
          echo "Sẽ deploy:"; cat paths.txt

      - name: php -l
        run: |
          set -euo pipefail
          find wp-content -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null
          echo "Đã kiểm $(find wp-content -name '*.php' | wc -l) file PHP."

  ftp:
    name: Đẩy lên Hostinger qua FTPS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Chưa đặt FTP_HOST / FTP_USER / FTP_PASSWORD — bỏ qua bước deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Chốt an toàn: FTP_PATH sai thì FTP-Deploy-Action sẽ lặng lẽ TẠO thư mục
      # mới và đẩy code vào chỗ không ai dùng. Liệt kê thư mục đích trước, bắt
      # buộc phải thấy themes/ và plugins/ — tức đó đúng là wp-content của một
      # bản WordPress đã cài.
      - name: Kiểm tra FTP_PATH trên server
        if: steps.check.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/public_html/wp-content/' }}
        run: |
          set -u
          set -o pipefail
          # GitHub chạy step bằng `bash -e`. Phần chẩn đoán bên dưới CỐ TÌNH gọi
          # những lệnh có thể hỏng, nên phải tắt -e, nếu không nó chết ngay ở
          # probe đầu tiên và không in được gì.
          set +e

          # Chứng chỉ FTPS của Hostinger cấp cho tên máy chủ, không cấp cho IP.
          # Nếu FTP_HOST là IP thì TLS không xác thực được (curl lỗi 60).
          # Thử xác thực đầy đủ trước; chỉ khi đúng lỗi chứng chỉ mới hạ xuống
          # --insecure, và nói rõ cách sửa cho đúng.
          TLS_OPT=""
          probe_err=$(curl -sS --ssl-reqd --max-time 30 \
                        --user "$FTP_USER:$FTP_PASSWORD" \
                        "ftp://${FTP_HOST}/" 2>&1 >/dev/null)
          if printf '%s' "$probe_err" | grep -qiE "certificate|SSL|\(60\)"; then
            TLS_OPT="--insecure"
            echo "::warning::Chứng chỉ FTPS không khớp FTP_HOST — nhiều khả năng FTP_HOST đang là địa chỉ IP. Tạm bỏ qua kiểm tra chứng chỉ để chạy tiếp. Nên đổi FTP_HOST sang tên máy chủ (dạng srvNNNN.hstgr.io) để TLS xác thực được đúng."
          fi

          # Liệt kê một thư mục qua FTPS. In ra tên, mỗi dòng một cái.
          # Không bao giờ in $FTP_PASSWORD — curl nhận nó qua --user, và thông
          # báo lỗi của curl không chứa mật khẩu.
          list_dir() {
            curl -sS $TLS_OPT --ssl-reqd --max-time 45 \
                 --user "$FTP_USER:$FTP_PASSWORD" \
                 "ftp://${FTP_HOST}$1" 2>&1 | awk 'NF {print $NF}'
          }

          # Khi hỏng thì in luôn bản đồ thư mục để biết FTP_PATH đúng là gì,
          # khỏi phải chạy lại lần nữa.
          diagnose() {
            echo
            echo "─── Chẩn đoán: cây thư mục trên server ───"
            for probe in / /public_html/ /public_html/wp-content/ /domains/; do
              echo "  [$probe]"
              list_dir "$probe" | sed 's/^/      /' | head -25
              echo
            done
            echo "Tìm thư mục nào chứa cả 'themes' và 'plugins' — đó là wp-content."
            echo "FTP_PATH = đường dẫn tới thư mục đó, có dấu / ở đầu và cuối."
          }

          path="$FTP_PATH"
          case "$path" in /*) ;; *) path="/$path" ;; esac
          case "$path" in */) ;; *) path="$path/" ;; esac
          echo "Đường dẫn kiểm tra: $path"

          if ! listing=$(curl -sS $TLS_OPT --ssl-reqd --max-time 60 \
                           --user "$FTP_USER:$FTP_PASSWORD" \
                           "ftp://${FTP_HOST}${path}"); then
            echo "Lỗi curl: $listing"
            diagnose
            echo "::error::Không liệt kê được ${path} trên ${FTP_HOST}. Xem phần chẩn đoán ở trên."
            exit 1
          fi

          names=$(printf '%s\n' "$listing" | awk 'NF {print $NF}')
          echo "Thư mục đích đang có:"
          printf '%s\n' "$names" | sed 's/^/  /' | head -30

          for d in themes plugins; do
            if ! printf '%s\n' "$names" | grep -qx "$d"; then
              diagnose
              echo "::error::Không thấy '${d}' trong ${path}. Dừng lại để không tạo thư mục rác trên server."
              exit 1
            fi
          done

          # wp-content thật phải nằm cạnh wp-includes. Nếu không, rất có thể
          # đang trỏ vào một thư mục chỉ tình cờ có themes/ và plugins/.
          parent="${path%wp-content/}"
          if [ "$parent" != "$path" ]; then
            if ! list_dir "$parent" | grep -qx "wp-includes"; then
              echo "::warning::Không thấy 'wp-includes' cạnh ${path} — kiểm tra lại WordPress có đầy đủ không."
            fi
          fi

          echo "OK — ${path} đúng là wp-content của một bản WordPress."

      - name: FTPS deploy
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ secrets.FTP_PATH || '/public_html/wp-content/' }}
          # Chỉ đẩy code. uploads/ và mọi thứ khác trên server không nằm trong
          # local-dir nên không bị đụng tới.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map
