# Deploy code lên Hostinger.
#
# Gói hosting không có SSH, nên không dùng được wp-cli. Có hai đường đẩy code,
# cùng tồn tại trong giai đoạn chuyển đổi:
#
#   job ftp            FTPS thẳng vào wp-content/themes và wp-content/plugins.
#                      Đang là đường chính.
#   job deploy-branch  dựng nhánh "deploy" để hPanel Git cài vào wp-content/app.
#                      Đường sẽ thay thế FTP khi chuyển đổi xong.
#
# Secret cần đặt ở GitHub repo → Settings → Secrets and variables → Actions:
#   FTP_HOST      IP máy chủ FTP, đúng như hPanel → Files → FTP Accounts hiện.
#                 Hostinger chỉ công bố IP; chứng chỉ FTPS của máy này là
#                 *.hstgr.io nên không tên nào ta có xác thực được. Kết nối vẫn
#                 mã hoá, chỉ không chứng thực được danh tính máy chủ. Chi tiết
#                 trong scripts/ftp-resolve.sh.
#   FTP_USER      username FTP
#   FTP_PASSWORD  password FTP
#   FTP_PATH      đang đặt = /domains/hoangditru.com/public_html/wp-content/
#                 Có giá trị này thì mỗi lần chạy chỉ tốn 1 phiên FTP; bỏ trống
#                 thì workflow phải tự dò, tốn 2-3 phiên. Script vẫn kiểm đường
#                 dẫn có đúng là wp-content hay không trước khi đẩy, nên đặt sai
#                 sẽ đỏ chứ không âm thầm đẩy nhầm chỗ.
#
# hPanel Git XOA SACH thư mục đích trước mỗi lần kéo code. Ngày 2026-10-23 nó
# được trỏ vào public_html và đã xoá toàn bộ file PHP gốc của WordPress.
# Install path BẮT BUỘC là wp-content/app — một thư mục riêng, rỗng.

name: Deploy

on:
  push:
    branches: [main]
  # PR cũng chạy job lint. Không có dòng này thì toàn bộ test chỉ chạy SAU khi
  # merge, tức lúc đang deploy lên site thật — biết code vỡ khi đã quá muộn.
  # Hai job deploy tự loại mình ra khỏi run của PR, xem 'if' của chúng.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Chỉ đọc ở mức workflow. Job nào cần ghi thì tự xin riêng.
permissions:
  contents: read

concurrency:
  # Tính theo ref: mọi lần deploy đều là refs/heads/main nên vẫn chung một nhóm
  # và vẫn huỷ bản cũ như trước. Nhưng run của PR tách thành nhóm riêng theo
  # nhánh, nếu không thì một push vào nhánh PR sẽ huỷ ngang lần deploy main
  # đang chạy.
  group: deploy-${{ github.ref }}
  # Huỷ run cũ khi có push mới. Hai push cách nhau một phút tạo hai cụm phiên
  # FTP liên tiếp — đúng thứ làm Hostinger chặn tạm thời (2026-10-23 và
  # 2026-10-24). Huỷ bản cũ thì chỉ commit mới nhất được đẩy, và vì
  # FTP-Deploy-Action chỉ ghi file trạng thái khi thành công nên run bị huỷ
  # giữa chừng không để lại trạng thái sai: lần sau đẩy lại là xong.
  cancel-in-progress: true

jobs:
  lint:
    name: Kiểm tra cú pháp PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc deploy/manifest.txt
        run: |
          set -euo pipefail
          tr -d '\r' < deploy/manifest.txt | grep -vE '^[[:space:]]*(#|$)' > paths.txt || true
          if [ ! -s paths.txt ]; then
            echo "::error::deploy/manifest.txt không có dòng nào."
            exit 1
          fi
          while IFS= read -r p; do
            case "$p" in
              themes/*|plugins/*) ;;
              *) echo "::error::Dòng '$p' phải bắt đầu bằng themes/ hoặc plugins/"; exit 1 ;;
            esac
            case "$p" in
              *..*) echo "::error::Dòng '$p' không hợp lệ"; exit 1 ;;
            esac
            if [ ! -d "wp-content/$p" ]; then
              echo "::error::Không tìm thấy wp-content/$p"
              exit 1
            fi
          done < paths.txt
          echo "Sẽ deploy:"; cat paths.txt

      # plugins-khac/ không deploy nhưng vẫn phải đúng cú pháp: đó là bản plugin
      # WebP đem cài cho site khác.
      - name: php -l
        run: |
          set -euo pipefail
          find wp-content plugins-khac -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null
          echo "Đã kiểm $(find wp-content plugins-khac -name '*.php' | wc -l) file PHP."

      # php -l KHONG bắt được file rỗng: file 0 byte không có lỗi cú pháp.
      # Ngày 2026-10-23 một lệnh sửa file viết sai đã cắt functions.php và
      # style.css về 0 byte, lint vẫn xanh, và suýt deploy lên server.
      - name: Không file nào được rỗng hoặc mất header
        run: |
          set -euo pipefail

          empty=$(find wp-content -type f -size 0 ! -name '.gitkeep' || true)
          if [ -n "$empty" ]; then
            echo "::error::Có file rỗng trong wp-content:"
            printf '%s\n' "$empty" | sed 's/^/  /'
            exit 1
          fi

          grep -q '^ Theme Name:' wp-content/themes/hoangditru/style.css \
            || { echo "::error::style.css mất header Theme Name"; exit 1; }
          grep -q "define( 'HDTC_VERSION'" wp-content/plugins/hoangditru-core/hoangditru-core.php \
            || { echo "::error::plugin lõi mất define HDTC_VERSION"; exit 1; }

          echo "OK — $(find wp-content -type f | wc -l) file, không có file rỗng."

      # php -l chỉ kiểm cú pháp TỪNG file. Nó không bắt được require sai đường
      # dẫn, hai module khai báo trùng tên hàm, hay lỗi chết lúc nạp. Bước này
      # nạp thật plugin lõi với WordPress giả lập.
      - name: Nạp thử plugin lõi
        run: php scripts/plugin-load.test.php

      # Allowlist này quyết định Biên tập viên mở được màn hình admin nào. Lỏng
      # một mục là lộ mục đáng ra phải chặn.
      - name: Test phân quyền Biên tập viên
        run: php scripts/phan-quyen.test.php

      # Filter này quyết định URL của mọi asset khi plugin được nạp từ app/.
      # Sai một dấu gạch chéo là vỡ toàn bộ CSS/JS.
      - name: Test filter URL của loader
        run: php scripts/loader-url.test.php

      # Template chạy ở phạm vi file, nên một foreach dùng lại tên biến đã gán ở
      # đầu file sẽ ghi đè biến đó. Không có lỗi PHP nào, chỉ sai dữ liệu hiển
      # thị — đã xảy ra với ảnh overlay của carousel Đầu tư quốc tịch.
      - name: Test phạm vi biến trong template
        run: php scripts/template-scope.test.php

      # Plugin WebP đổi URL của mọi ảnh trên site. Hai bản của nó phải giống
      # hệt nhau ở phần dùng chung, và bộ lọc HTML không được làm hỏng thẻ.
      - name: Test plugin WebP
        run: php scripts/webp.test.php

      # Script dò wp-content quyết định file được đẩy đi đâu, nên nó phải có
      # test và test phải chạy trước mỗi lần deploy.
      - name: Test scripts/ftp-resolve.sh
        run: bash scripts/ftp-resolve.test.sh

  ftp:
    name: Đẩy lên Hostinger qua FTPS
    needs: lint
    # Không deploy từ PR. PR chỉ để kiểm tra; đẩy lên site thật là việc của
    # push vào main. PR từ fork cũng không có secret FTP.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Chưa đặt FTP_HOST / FTP_USER / FTP_PASSWORD — bỏ qua bước deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Dò wp-content thay vì tin vào FTP_PATH. Lý do: FTP-Deploy-Action tự TẠO
      # thư mục nếu server-dir không tồn tại, nên một FTP_PATH sai sẽ chạy xanh
      # mà code nằm ở chỗ không ai dùng.
      - name: Dò wp-content trên server
        id: resolve
        if: steps.check.outputs.ok == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set +e
          path=$(bash scripts/ftp-resolve.sh)
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          echo "server-dir sẽ dùng: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Lần 1. continue-on-error để còn cơ hội thử lại: Hostinger chặn tạm thời
      # khi có nhiều phiên FTP trong thời gian ngắn, lỗi đó tự hết sau vài phút.
      - name: FTPS deploy
        id: ftp1
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ steps.resolve.outputs.path }}
          # Chỉ đẩy code. uploads/ và mọi thứ khác trên server không nằm trong
          # local-dir nên không bị đụng tới.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map

      - name: Nghỉ 4 phút trước khi thử lại
        if: steps.check.outputs.ok == 'true' && steps.ftp1.outcome == 'failure'
        run: |
          echo "::warning::Lần đẩy thứ nhất thất bại. Nghỉ 4 phút rồi thử lại — máy chủ FTP của Hostinger chặn tạm thời khi có nhiều phiên liên tiếp, 90 giây đã thử và không đủ."
          sleep 240

      - name: FTPS deploy (lần 2)
        id: ftp2
        if: steps.check.outputs.ok == 'true' && steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wp-content/
          server-dir: ${{ steps.resolve.outputs.path }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map

      # continue-on-error ở lần 1 làm job vẫn xanh kể cả khi cả hai lần đều hỏng,
      # nên phải tự đánh đỏ. Thiếu always() thì chính bước này bị skip khi lần
      # hai hỏng, và thông báo lỗi không bao giờ in ra.
      - name: Kết luận
        if: always() && steps.check.outputs.ok == 'true'
        run: |
          if [ "${{ steps.ftp1.outcome }}" = "success" ]; then
            echo "Đẩy thành công ngay lần đầu."
          elif [ "${{ steps.ftp2.outcome }}" = "success" ]; then
            echo "Đẩy thành công ở lần thử thứ hai."
          else
            echo "::error::Cả hai lần đẩy FTPS đều thất bại."
            exit 1
          fi

  # Nhánh "deploy" là thứ hPanel Git cài vào wp-content/app. Gốc nhánh đúng như
  # loader mong đợi: themes/ + plugins/, kèm mu-plugin.php để copy sang
  # wp-content/mu-plugins mà không phải tải về máy.
  #
  # Commit NOI TIEP, không force-push, để git pull phía Hostinger luôn chạy được.
  deploy-branch:
    name: Dựng nhánh deploy cho hPanel Git
    needs: lint
    # Như job ftp: PR không được ghi vào nhánh deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Quyền ghi chỉ cấp cho job này, không cấp cho cả workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cập nhật nhánh deploy
        run: |
          set -euo pipefail
          tr -d '\r' < deploy/manifest.txt | grep -vE '^[[:space:]]*(#|$)' > /tmp/paths.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC_SHA=$(git rev-parse --short HEAD)

          OUT=$(mktemp -d)
          if git ls-remote --exit-code --heads origin deploy > /dev/null 2>&1; then
            git fetch origin deploy
            git worktree add "$OUT" -B deploy origin/deploy
          else
            git worktree add --detach "$OUT"
            git -C "$OUT" checkout --orphan deploy
          fi

          find "$OUT" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p "$OUT/themes" "$OUT/plugins"

          while IFS= read -r p; do
            cp -R "wp-content/$p" "$OUT/$p"
          done < /tmp/paths.txt

          cp deploy/mu-plugin.php "$OUT/mu-plugin.php"

          find "$OUT" -name '.DS_Store' -delete

          cd "$OUT"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua."
          else
            git commit -q -m "Deploy từ main @ $SRC_SHA"
            git push origin deploy
            echo "Đã cập nhật nhánh deploy."
          fi
